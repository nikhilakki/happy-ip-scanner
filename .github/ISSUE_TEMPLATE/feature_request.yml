name: Feature request
description: Suggest a new feature or an improvement to Happy IP Scanner.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check [TODO.md](https://github.com/nikhilakki/happy-ip-scanner/blob/main/TODO.md) first; your idea may already be on the roadmap.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
      placeholder: I scan the same /24 several times a day and every run waits for the same dead addresses to time out.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work? Sketch the CLI flag, GUI control, or behaviour you have in mind.
      placeholder: Add a "Rescan alive hosts" button in the GUI and a matching CLI flag that re-run the previous scan against only the hosts that were alive.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried or thought about.
    validations:
      required: false

  - type: dropdown
    id: mode
    attributes:
      label: Which part of the scanner does this affect?
      options:
        - GUI
        - CLI
        - Both
        - Engine (shared scanning core)
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this feature.
          required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I checked TODO.md and the existing issues, and this feature is not already planned or requested.
          required: true
