[package]
name = "happy-ip-scanner"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Nikhil Akki"]
description = "A fast, friendly, cross-platform IP and port scanner in Rust, inspired by Angry IP Scanner"
license = "MIT"
repository = "https://github.com/nikhilakki/happy-ip-scanner"
homepage = "https://github.com/nikhilakki/happy-ip-scanner"
readme = "README.md"
keywords = ["network", "scanner", "ip", "port-scanner", "egui"]
categories = ["command-line-utilities", "network-programming", "gui"]
exclude = [".github/", "docs/", ".editorconfig", "TODO.md"]

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal", "io-util", "fs"] }
ipnet = "2.11"
dns-lookup = "2.0"
local-ip-address = "0.6"

# Desktop GUI (egui / eframe); `persistence` stores preferences and window geometry between runs
eframe = { version = "0.31", features = ["persistence"] }
egui_extras = "0.31"

# CLI & Formatting
clap = { version = "4.5", features = ["derive"] }
comfy-table = "8.0"
indicatif = "0.18"

# Serialization & Export
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
rfd = "0.15"
open = "5.3"

[target.'cfg(unix)'.dependencies]
# Used only to raise the open-file (socket) limit at startup
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
