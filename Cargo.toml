[package]
name = "happy-ip-scanner"
version = "0.1.0"
edition = "2024"
authors = ["Nikhil Akki"]
description = "A fast, friendly, cross-platform IP and port scanner in Rust (Angry IP Scanner port)"
license = "MIT"
repository = "https://github.com/nikhilakki/happy-ip-scanner"
homepage = "https://github.com/nikhilakki/happy-ip-scanner"
readme = "README.md"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal", "io-util"] }
ipnet = "2.11"
dns-lookup = "2.0"
local-ip-address = "0.6"

# Desktop GUI (egui / eframe)
eframe = { version = "0.31", default-features = true }
egui_extras = { version = "0.31", features = ["default"] }

# CLI & Formatting
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.1"
indicatif = "0.17"
colored = "3.0"

# Serialization & Export
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
rfd = "0.15"
open = "5.3"
chrono = "0.4"
